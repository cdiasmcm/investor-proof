# Runs the unit tests on every pull request into main, and on every push to main.
# The job name "unit-tests" is the status check to require in the branch rule for main.
name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Run unit tests
        run: |
          set -o pipefail
          bun test 2>&1 | tee bun-test.log
      - name: Explain the failure and the fix
        if: failure()
        run: bun scripts/test-failure-help.ts bun-test.log
